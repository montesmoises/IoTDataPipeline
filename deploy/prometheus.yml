# Prometheus: raspa /metrics del servicio cada 15 s.
# Lo arranca deploy/iniciar-observabilidad.ps1

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alertas.yml

scrape_configs:
  - job_name: iotdatapipeline
    static_configs:
      - targets: ['localhost:9100']
        labels:
          planta: 'principal'

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
